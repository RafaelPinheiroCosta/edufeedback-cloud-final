name: CI - Build e Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar, testar e verificar qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Aplicar formatação padronizada
        run: mvn --batch-mode --no-transfer-progress spotless:apply
      - name: Compilar, testar e verificar qualidade
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-testes
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 7
