quarkus.http.port=8083
quarkus.azure-functions.app-name=${AZURE_REPORT_FUNCTION_APP:func-edufeedback-report-dev-001}
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/edufeedback}
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.datasource.username=${DATABASE_USERNAME:edufeedback}
quarkus.datasource.password=${DATABASE_PASSWORD:edufeedback}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=2
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.database.default-schema=edufeedback
quarkus.flyway.migrate-at-start=false
app.admin-email=${ADMIN_EMAIL:admin@edufeedback.local}
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
app.email.connection-string=${AZURE_COMMUNICATION_CONNECTION_STRING:}
app.email.sender=${EMAIL_SENDER:}

# Segurança JWT/RBAC dos endpoints administrativos HTTP
quarkus.http.auth.proactive=true
mp.jwt.verify.issuer=edufeedback
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256

# OpenAPI e Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=EduFeedback Cloud

# Problem Details e logs
quarkus.http.non-application-root-path=q
# Observabilidade: logs estruturados capturados pelo Azure Application Insights
quarkus.application.name=edufeedback-report-function
quarkus.log.level=INFO
quarkus.log.category."br.com.edufeedback".level=INFO
%prod.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

