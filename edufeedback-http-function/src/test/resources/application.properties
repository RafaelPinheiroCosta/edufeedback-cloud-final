# Os testes usam H2 em memória e não dependem de Docker/Testcontainers.
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:edufeedback;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS edufeedback\\;SET SCHEMA edufeedback
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.default-schema=edufeedback
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.flyway.migrate-at-start=false
quarkus.http.test-port=0
