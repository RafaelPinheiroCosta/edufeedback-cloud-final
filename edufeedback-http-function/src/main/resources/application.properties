quarkus.http.port=8081
quarkus.azure-functions.app-name=${AZURE_HTTP_FUNCTION_APP:func-edufeedback-http-dev-001}
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/edufeedback}
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.datasource.username=${DATABASE_USERNAME:edufeedback}
quarkus.datasource.password=${DATABASE_PASSWORD:edufeedback}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=2
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.database.default-schema=edufeedback
quarkus.flyway.schemas=edufeedback
quarkus.flyway.create-schemas=true
quarkus.flyway.migrate-at-start=true
app.queue.name=${QUEUE_NAME:feedback-critical-notifications}
app.queue.connection-string=${AZURE_STORAGE_CONNECTION_STRING:UseDevelopmentStorage=true}
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=EduFeedback HTTP API
quarkus.smallrye-openapi.info-version=1.0.0
%test.quarkus.flyway.migrate-at-start=true

quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper

# Segurança JWT/RBAC de demonstração
quarkus.http.auth.proactive=true
mp.jwt.verify.issuer=edufeedback
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256
smallrye.jwt.new-token.signature-algorithm=RS256
smallrye.jwt.new-token.issuer=edufeedback
smallrye.jwt.new-token.lifespan=3600
smallrye.jwt.sign.key.location=privateKey.pem
app.security.token-lifespan=3600
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi

# Observabilidade: logs estruturados capturados pelo Azure Application Insights
quarkus.application.name=edufeedback-http-function
quarkus.log.level=INFO
quarkus.log.category."br.com.edufeedback".level=INFO
%prod.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

quarkus.default-locale=pt-BR
quarkus.locales=pt-BR,en-US
